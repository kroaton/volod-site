<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3a8a" />
    <title>Down for Maintenance</title>
    <style>
      :root { color-scheme: dark light; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #1e3a8a; /* same purple */
        color: #fff;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', Arial, sans-serif;
      }
      .wrap { text-align: center; padding: 2rem; }
      h1 { font-weight: 700; letter-spacing: 0.02em; font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 0.25rem; }
      p { opacity: 0.9; margin: 0; font-size: clamp(1rem, 2.5vw, 1.125rem); }
    </style>
  </head>
  <body>
    <div class="wrap" role="status" aria-live="polite">
      <h1>DOWN FOR MAINTENANCE</h1>
      <p>We’ll be back shortly.</p>
    </div>
  </body>
  </html>
